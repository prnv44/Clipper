name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[all,dev]'
      - name: Compile
        run: python -m compileall -q ziv tests
      - name: Test
        run: make test PYTHON=python
      - name: Shell syntax
        run: bash -n ziv.sh
      - name: Build distributions
        run: python -m build

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and development tools
        shell: pwsh
        run: python -m pip install --upgrade pip && python -m pip install -e ".[all,dev]"
      - name: Test
        shell: pwsh
        run: python -m pytest -q
      - name: Parse PowerShell launchers
        shell: pwsh
        run: |
          $files = @("ziv.ps1", "update.ps1")
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $pwd $file), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
